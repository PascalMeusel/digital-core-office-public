name: digital-core-office-time-tracking

services:
  app:
    build:
      context: ..
      dockerfile: time-tracking-system/Dockerfile
    image: digital-core-office-time-tracking:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4177
      DCO_TIMEZONE: ${DCO_TIMEZONE:-Europe/Berlin}
      TZ: ${DCO_TIMEZONE:-Europe/Berlin}
      TIME_TRACKER_DATA: /data/time-tracker.sqlite
      TIME_TRACKER_BACKUP_DIR: /data/backups
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL in .env.docker, for example https://time.example.com}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env.docker, for example openssl rand -base64 32}
      REQUIRE_DATA_ENCRYPTION: ${REQUIRE_DATA_ENCRYPTION:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-8}
      LOGIN_RATE_LIMIT_WINDOW_MINUTES: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:-15}
      PASSWORD_RESET_RATE_LIMIT_MAX: ${PASSWORD_RESET_RATE_LIMIT_MAX:-5}
      PASSWORD_RESET_RATE_LIMIT_WINDOW_MINUTES: ${PASSWORD_RESET_RATE_LIMIT_WINDOW_MINUTES:-30}
      DOCTOR_NOTE_MAX_BYTES: ${DOCTOR_NOTE_MAX_BYTES:-2097152}
      ALLOW_PRIVATE_CALDAV_URLS: ${ALLOW_PRIVATE_CALDAV_URLS:-false}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - time_tracking_data:/data
      - userbase_exchange:/userbase
    expose:
      - "4177"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: ${APP_HOST:?Set APP_HOST in .env.docker, for example time.example.com}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  time_tracking_data:
  userbase_exchange:
  caddy_data:
  caddy_config:
