<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Digital Core Office Time</title>
    <script>
      ;(() => {
        try {
          const saved = localStorage.getItem('digital-core-office.theme') || localStorage.getItem('time-tracker-theme')
          const theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia?.('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
    <style>
      :root {
        --boot-page: #f4f7f8;
        --boot-ink: #243041;
        --boot-strong: #0f172a;
        --boot-symbol-shadow: rgba(37, 99, 235, 0.22);
      }

      :root[data-theme='dark'] {
        --boot-page: #101418;
        --boot-ink: #d8e0e8;
        --boot-strong: #f4f8fb;
        --boot-symbol-shadow: rgba(71, 191, 255, 0.2);
      }

      html,
      body,
      #root {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        background: var(--boot-page);
        color: var(--boot-ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .initial-app-shell {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 32px;
        background-color: var(--boot-page);
        color: var(--boot-ink);
        opacity: 1;
        transition:
          opacity 240ms cubic-bezier(0.2, 0.75, 0.25, 1),
          transform 240ms cubic-bezier(0.2, 0.75, 0.25, 1);
      }

      #root[data-boot-exit='true'] .initial-app-shell {
        opacity: 0;
        transform: translateY(-4px);
      }

      .initial-splash {
        display: grid;
        justify-items: center;
        gap: 18px;
        text-align: center;
      }

      .initial-symbol {
        width: 62px;
        height: auto;
        display: block;
        filter: drop-shadow(0 16px 28px var(--boot-symbol-shadow));
      }

      .initial-splash strong {
        display: block;
        color: var(--boot-strong);
        font-size: clamp(1.35rem, 4vw, 1.9rem);
        font-weight: 750;
        letter-spacing: 0;
        line-height: 1.1;
      }

      @media (prefers-reduced-motion: reduce) {
        .initial-app-shell {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root" data-booting="true">
      <main class="initial-app-shell" aria-label="Digital Core Office Time">
        <section class="initial-splash">
          <svg class="initial-symbol" aria-hidden="true" focusable="false" viewBox="0 0 48 48">
            <defs>
              <linearGradient id="dco-boot-gradient" x1="8" x2="40" y1="8" y2="40">
                <stop stop-color="#0f766e" />
                <stop offset="1" stop-color="#2563eb" />
              </linearGradient>
            </defs>
            <rect fill="url(#dco-boot-gradient)" height="48" rx="10" width="48" />
            <circle cx="24" cy="26" fill="none" r="12" stroke="#ecfeff" stroke-width="3" />
            <path d="M24 26v-7m0 7 6 4M19 9h10M24 9v5" fill="none" stroke="#99f6e4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" />
          </svg>
          <strong>Digital Core Office Time</strong>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
