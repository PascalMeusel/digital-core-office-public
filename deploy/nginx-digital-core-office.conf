# Alternative reverse-proxy configuration for hosts that already use nginx.
# The exact product paths serve the persistent Core shell; product assets and
# APIs below those paths continue to use their independent services.

# Preserve the browser's HTTPS origin when TLS terminates at an upstream proxy.
# Otherwise nginx expands relative redirects using its internal HTTP connection.
absolute_redirect off;

location = /_dco_auth_time {
    internal;
    proxy_pass http://127.0.0.1:4167/api/core/internal/route-check?module=time;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    include /etc/digital-core-office/nginx-internal-secret.conf;
}

location = /_dco_auth_inventory {
    internal;
    proxy_pass http://127.0.0.1:4167/api/core/internal/route-check?module=inventory;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    include /etc/digital-core-office/nginx-internal-secret.conf;
}

location = /_dco_auth_agile {
    internal;
    proxy_pass http://127.0.0.1:4167/api/core/internal/route-check?module=agile;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    include /etc/digital-core-office/nginx-internal-secret.conf;
}

location = /time { return 308 /time/; }
location = /time/ { include /etc/nginx/snippets/digital-core-office-core-proxy.conf; }
location ^~ /time/ {
    auth_request /_dco_auth_time;
    proxy_pass http://127.0.0.1:4177/;
    include /etc/nginx/snippets/digital-core-office-module-proxy.conf;
}

location = /inventory { return 308 /inventory/; }
location = /inventory/ { include /etc/nginx/snippets/digital-core-office-core-proxy.conf; }
location ^~ /inventory/ {
    client_max_body_size 8m;
    auth_request /_dco_auth_inventory;
    proxy_pass http://127.0.0.1:4187/;
    include /etc/nginx/snippets/digital-core-office-module-proxy.conf;
}

location = /agile { return 308 /agile/; }
location = /agile/ { include /etc/nginx/snippets/digital-core-office-core-proxy.conf; }
location ^~ /agile/ {
    auth_request /_dco_auth_agile;
    proxy_pass http://127.0.0.1:4197/;
    include /etc/nginx/snippets/digital-core-office-module-proxy.conf;
}

location = /arbeitszeitbuero { return 308 /time/; }
location ~ ^/arbeitszeitbuero/(.*)$ { return 308 /time/$1; }
location = /digital-office/inventory-system { return 308 /inventory/; }
location ~ ^/digital-office/inventory-system/(.*)$ { return 308 /inventory/$1; }
location = /inventorySystem { return 308 /inventory/; }
location ~ ^/inventorySystem/(.*)$ { return 308 /inventory/$1; }

location = /digital-core-office-test { return 308 /; }
location = /digital-core-office-test/ { return 308 /; }
location = /digital-core-office-test/time { return 308 /time/; }
location ~ ^/digital-core-office-test/time/(.*)$ { return 308 /time/$1; }
location = /digital-core-office-test/inventory { return 308 /inventory/; }
location ~ ^/digital-core-office-test/inventory/(.*)$ { return 308 /inventory/$1; }
location = /digital-core-office-test/agile { return 308 /agile/; }
location ~ ^/digital-core-office-test/agile/(.*)$ { return 308 /agile/$1; }

location / {
    include /etc/nginx/snippets/digital-core-office-core-proxy.conf;
}
